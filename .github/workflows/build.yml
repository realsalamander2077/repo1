name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Add beatplayer:// deep link
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          f='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="beatplayer"/></intent-filter>'
          s=s.replace('</activity>',f+'</activity>',1)
          open(p,'w').write(s)
          PY
      - name: Add native volume plugin
        run: |
          D=android/app/src/main/java/com/beatplayer/app
          cat > $D/VolumePlugin.java <<'EOF'
          package com.beatplayer.app;

          import android.content.Context;
          import android.media.AudioManager;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Volume")
          public class VolumePlugin extends Plugin {
            private AudioManager am() {
              return (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
            }
            @PluginMethod
            public void get(PluginCall call) {
              AudioManager a = am();
              int max = a.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
              int cur = a.getStreamVolume(AudioManager.STREAM_MUSIC);
              JSObject r = new JSObject();
              r.put("value", (int) Math.round(cur * 100.0 / max));
              call.resolve(r);
            }
            @PluginMethod
            public void set(PluginCall call) {
              Integer v = call.getInt("value", 50);
              AudioManager a = am();
              int max = a.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
              a.setStreamVolume(AudioManager.STREAM_MUSIC, (int) Math.round(v * max / 100.0), 0);
              call.resolve();
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.beatplayer.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(VolumePlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: beatplayer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Beatplayer build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
